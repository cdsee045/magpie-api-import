name: Validate plugin modules
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  typescript:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node node_modules/bun/install.js
      - run: node node_modules/esbuild/install.js
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'Windows'
        run: npx playwright install chromium
      - run: npm run check
      - run: npm run pack:check
      - if: runner.os == 'Windows' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run test:github-install
  windows-bridge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.x'
          cache: false
      - working-directory: integration/windows
        run: go test -v ./...
      - working-directory: integration/windows
        run: go vet ./...
      - working-directory: integration/windows
        run: go build ./...
