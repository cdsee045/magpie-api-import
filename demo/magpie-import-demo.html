<script id="magpie-demo-core">
(() => {
  const makeJson = (url, key, name) => JSON.stringify({ _type:'newapi_channel_conn', url, key, ...(name ? {name} : {}) }, null, 2);
  const screenshotText = ['baseurl: https://relay.example/v1', 'BLG 1:1', 'Key(base64): '+btoa('demo_valid_blg_one'), 'BLG 2:1', 'Key(base64): '+btoa('demo_valid_blg_two'), '我们是冠军', 'Key(base64): '+btoa('demo_valid_champion')].join('\n');
  const scenarios = {
    json:{kind:'text',text:makeJson('https://api.example/v1','demo_valid_json_2026','我的 API'),label:'结构化 JSON，含完整地址与密钥'},
    image:{kind:'image',text:screenshotText,label:'模拟 OCR 结果，所有密钥都是虚构示例'},
    invalid:{kind:'text',text:makeJson('https://api.example/v1','demo_invalid_expired','失效的 API'),label:'模拟鉴权失败：401'},
    timeout:{kind:'text',text:'名称: 备用线路\nbaseurl: https://backup.example/v1\nkey: demo_timeout_backup',label:'模拟网络超时'},
    incomplete:{kind:'text',text:'名称: 尚未配置的 API\nkey: demo_valid_incomplete',label:'密钥完整，但没有提供 API 地址'},
    unrelated:{kind:'text',text:'周五下午三点开会，记得带上产品方案。',label:'无关内容，不会出现识别或添加提示'},
    duplicate:{kind:'text',text:makeJson('https://team.example/v1','demo_valid_team_existing','团队网关'),label:'与供应商列表里的团队网关完全相同'}
  };
  const existingProviders = () => [
    {id:'deepseek',name:'DeepSeek',base:'https://deepseek.example/v1',key:'demo_valid_existing_deepseek',protocol:'chat',model:'demo-chat',models:2,current:true},
    {id:'team',name:'团队网关',base:'https://team.example/v1',key:'demo_valid_team_existing',protocol:'chat',model:'demo-chat',models:3,current:false}
  ];
  function normalizeUrl(value) {
    const u = new URL(String(value).trim());
    if (!['https:','http:'].includes(u.protocol) || u.username || u.password || u.search || u.hash) throw new Error('地址格式有误，请填写 API 基础地址');
    if (u.protocol === 'http:' && !['localhost','127.0.0.1','[::1]'].includes(u.hostname)) throw new Error('远程 API 请使用 HTTPS 地址');
    u.pathname = u.pathname.replace(/\/(?:chat\/completions|models)\/?$/,'').replace(/\/+$/,'');
    if (!u.pathname || u.pathname === '/') u.pathname = '/v1';
    return u.toString().replace(/\/$/,'');
  }
  const completeKey = key => !!key && key.length >= 8 && !/[*•…\s]/.test(key);
  function candidate(name, base, key, model) {
    let normalized = '', issue = '';
    try { if(base) normalized = normalizeUrl(base); } catch(error) { issue = error.message; }
    if(!base) issue = '缺少 API 地址，请补充后再验证';
    if(!completeKey(String(key || ''))) issue = '密钥缺失、被遮挡或不完整，请重新粘贴原文';
    return {name:String(name||'').trim() || (normalized ? new URL(normalized).hostname : '自定义 API'), base:normalized || String(base||''), key:String(key||'').trim(), protocol:'chat', model:String(model||'demo-chat'), issue};
  }
  function parseClipboard(snapshot) {
    const text = String(snapshot?.text || '').trim();
    if(!text || text.length > 16000) return {kind:'none',candidates:[]};
    if(text.startsWith('{')) {
      try {
        const obj = JSON.parse(text);
        if(!obj || Array.isArray(obj) || typeof obj !== 'object') return {kind:'none',candidates:[]};
        const base = obj.url || obj.baseurl || obj.base_url || obj.baseURL || '';
        const key = obj.key || obj.apiKey || obj.api_key || '';
        if(!base && !key) return {kind:'none',candidates:[]};
        const c = candidate(obj.name,base,key,obj.model);
        return {kind:c.issue?'incomplete':'candidates',candidates:[c],issue:c.issue};
      } catch { return {kind:'incomplete',candidates:[],issue:'JSON 格式不完整，请检查后重新粘贴'}; }
    }
    const lines = text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
    const urlMatch = text.match(/https?:\/\/[^\s<>"'`，。]+/i);
    const base = urlMatch?.[0] || '';
    const nameMatch = text.match(/(?:名称|name)\s*[:：]\s*([^\n]+)/i);
    const candidates = [];
    for(let i=0;i<lines.length;i++) {
      const match = lines[i].match(/^(?:api[_ -]?key|key|密钥)(\s*\(base64\))?\s*[:：]\s*(.*)$/i);
      if(!match) continue;
      let key = match[2] || lines[i+1] || '';
      if(match[1]) {
        try {
          if(!/^[A-Za-z0-9+/]+={0,2}$/.test(key) || key.length%4===1) throw new Error('invalid base64');
          key = atob(key);
          if(!/^[\x21-\x7e]+$/.test(key)) throw new Error('invalid decoded key');
        } catch { return {kind:'incomplete',candidates:[],issue:'Base64 密钥无法解码，请检查截图识别结果'}; }
      }
      const previous = lines[i-1] || '';
      const name = nameMatch?.[1] || (previous && !/https?:|key|密钥/i.test(previous) ? previous : '');
      candidates.push(candidate(name,base,key));
    }
    if(!candidates.length && !base) return {kind:'none',candidates:[]};
    if(!candidates.length) candidates.push(candidate(nameMatch?.[1],base,''));
    const issue = candidates.find(c=>c.issue)?.issue || '';
    return {kind:issue?'incomplete':'candidates',candidates,issue};
  }
  const fingerprint = c => JSON.stringify([c.base,c.key,c.protocol,c.model]);
  const sameCredentials = (a,b) => a.base===b.base && a.key===b.key && a.protocol===b.protocol;
  const maskedKey = key => !key ? '未提供' : key.slice(0,4)+'••••••••'+key.slice(-4);
  function simulateValidation(c) {
    if(c.issue) return {ok:false,message:c.issue};
    if(c.key.startsWith('demo_invalid')) return {ok:false,code:'401',message:'Key 已失效或没有访问权限，请更换密钥后重试。'};
    if(c.key.startsWith('demo_timeout')) return {ok:false,code:'TIMEOUT',message:'暂时无法连接 API 地址，请检查线路或稍后重试。'};
    return {ok:true,model:c.model,protocol:c.protocol,latency:186};
  }
  class DemoEngine {
    constructor({onChange=()=>{},delay=ms=>new Promise(resolve=>setTimeout(resolve,ms))}={}) {
      this.onChange=onChange;this.delay=delay;this.revision=0;this.handled=new Set();this.cache=new Map();
      this.state={page:'providers',scenario:'json',clipboard:{...scenarios.json},auto:true,status:'idle',phase:0,candidates:[],selected:null,confirmation:false,result:null,providers:existingProviders(),lastAdded:null,fieldIssue:''};
    }
    notify(){this.onChange(this.state);}
    cancelPending(){this.revision++;this.state.confirmation=false;this.state.result=null;this.state.status='idle';this.state.phase=0;this.state.candidates=[];this.state.selected=null;this.state.fieldIssue='';}
    setPage(page){if(!['providers','custom','agents','usage','settings'].includes(page))return;this.cancelPending();this.state.page=page;this.notify();if(page==='custom'&&this.state.auto)return this.detect();}
    setClipboard(snapshot,scenario='custom'){this.cancelPending();this.state.clipboard={kind:snapshot.kind||'text',text:String(snapshot.text||'')};this.state.scenario=scenario;this.state.lastAdded=null;this.notify();if(this.state.page==='custom'&&this.state.auto)return this.detect();}
    setScenario(id){if(scenarios[id])return this.setClipboard({...scenarios[id]},id);}
    setAuto(enabled){this.state.auto=!!enabled;if(!enabled)this.cancelPending();this.notify();if(enabled&&this.state.page==='custom')return this.detect();}
    async detect(force=false){
      if(this.state.page!=='custom')return;
      const run=++this.revision;this.state.confirmation=false;this.state.result=null;this.state.status='reading';this.state.phase=0;this.state.fieldIssue='';this.notify();
      await this.delay(this.state.clipboard.kind==='image'?650:300);
      if(run!==this.revision||this.state.page!=='custom')return;
      const parsed=parseClipboard(this.state.clipboard);this.state.candidates=parsed.candidates;this.state.selected=parsed.candidates[0]||null;
      if(parsed.kind==='none'){this.state.status='idle';this.state.selected=null;this.notify();return;}
      if(parsed.kind==='incomplete'){this.state.status='incomplete';this.state.fieldIssue=parsed.issue;this.notify();return;}
      if(parsed.candidates.length>1){this.state.status='selecting';this.state.selected=null;this.notify();return;}
      return this.validate(this.state.selected,force);
    }
    selectCandidate(index){const c=this.state.candidates[index];if(c)return this.validate(c);}
    edit(fields){
      const prior=this.state.selected||{name:'自定义 API',base:'',key:'',model:'demo-chat'};
      const c=candidate(fields.name??prior.name,fields.base??prior.base,fields.key??prior.key,fields.model??prior.model);
      const changed=fingerprint(c)!==fingerprint(prior);
      if(changed){this.revision++;this.state.confirmation=false;this.state.result=null;this.state.status='edited';this.state.fieldIssue=c.issue;}
      this.state.selected=c;this.notify();
    }
    async validate(c,force=false){
      if(this.state.page!=='custom'||!c)return;
      const run=++this.revision;this.state.selected={...c};this.state.confirmation=false;this.state.result=null;this.state.fieldIssue='';
      if(c.issue){this.state.status='incomplete';this.state.fieldIssue=c.issue;this.notify();return;}
      if(this.state.providers.some(p=>sameCredentials(p,c))){this.state.status='duplicate';this.notify();return;}
      const fp=fingerprint(c);
      if(this.handled.has(fp)&&!force){this.state.status='dismissed';this.notify();return;}
      const cached=this.cache.get(fp);
      if(cached&&!force){this.state.result=cached;this.state.status='verified';this.state.phase=3;this.state.confirmation=true;this.notify();return;}
      this.state.status='validating';this.state.phase=1;this.notify();
      for(const phase of [2,3]){await this.delay(550);if(run!==this.revision||this.state.page!=='custom')return;this.state.phase=phase;this.notify();}
      await this.delay(450);if(run!==this.revision||this.state.page!=='custom')return;
      const result=simulateValidation(c);this.state.result=result;
      if(result.ok){this.cache.set(fp,result);this.state.status='verified';this.state.confirmation=true;}
      else this.state.status='failed';
      this.notify();
    }
    dismiss(){if(this.state.selected)this.handled.add(fingerprint(this.state.selected));this.state.confirmation=false;this.state.status='dismissed';this.notify();}
    add(){
      if(this.state.page!=='custom'||!this.state.confirmation||this.state.status!=='verified'||!this.state.result?.ok||!this.state.selected)return false;
      const c={...this.state.selected};if(this.state.providers.some(p=>sameCredentials(p,c)))return false;
      const p={...c,id:'added-'+this.state.providers.length,models:1,current:false};this.state.providers.push(p);this.handled.add(fingerprint(c));this.revision++;this.state.lastAdded=p;this.state.confirmation=false;this.state.status='saved';this.state.page='providers';this.notify();return true;
    }
  }
  globalThis.MagpieDemoCore={scenarios,existingProviders,normalizeUrl,parseClipboard,fingerprint,sameCredentials,maskedKey,simulateValidation,candidate,DemoEngine};
})();
</script>
<script id="magpie-demo-ui">

    }

  }
  function confirmationMarkup(s,modal){

  function customMarkup(s){

      <div class="mp-form-panel"><div class="mp-panel-heading mp-row mp-between"><h2>连接信息</h2><span class="mp-pill">API Key</span></div>

        <label class="mp-field full"><span>API Key</span><span class="mp-key-field"><input id="mp-key" type="${reveal?'text':'password'}" value="${escape(c.key)}" placeholder="粘贴你的 API Key" spellcheck="false" autocomplete="off" ${busy?'disabled':''}><button type="button" class="mp-button cursor-interaction" data-action="reveal" aria-label="${reveal?'隐藏密钥':'显示密钥'}">${icon(reveal?'eye-off':'eye')}</button></span></label>

      <p class="mp-section-label">添加模型来源</p><button type="button" class="mp-add cursor-interaction" data-action="custom"><span class="mp-add-icon">${icon('plus')}</span><span class="mp-add-copy"><strong style="font-weight:500">自定义供应商</strong><span>使用 API 地址和密钥接入</span></span>${icon('chevron-right')}</button>

  function otherMarkup(s){
    if(s.page==='settings')return `<div class="mp-heading"><div><h1>设置</h1><p class="mp-small mp-muted">按你的习惯调整 Magpie</p></div></div><h2>剪贴板导入</h2><label class="mp-setting-row"><span><strong style="font-weight:500">自动识别 API 配置</strong><p class="mp-small mp-muted" style="margin-top:4px">仅进入自定义供应商页面时检测</p></span><input type="checkbox" id="mp-settings-auto" aria-label="自动识别 API 配置" ${s.auto?'checked':''}></label><p class="mp-small mp-muted" style="margin-top:17px">关闭后，仍可在自定义供应商页面手动重新检测。</p>`;

    return `<div class="mp-heading"><div><h1>用量</h1><p class="mp-small mp-muted">查看模型请求记录</p></div></div><div class="mp-empty">${icon('chart-no-axes-combined')}<h3>暂无请求记录</h3><p class="mp-small">开始使用模型后，请求会显示在这里。</p></div>`;
  }
  function render(){
    const s=engine.state;
    if(fieldChange&&s.page==='custom'){
      const detection=main.querySelector('#mp-detection');if(detection)detection.innerHTML=statusMarkup(s);
      if(!s.confirmation){overlay.hidden=true;overlay.innerHTML='';main.inert=false;root.querySelector('.mp-sidebar').inert=false;main.querySelector('.mp-inline-area')?.remove();previousConfirmation=false;}
      else if(design.promptStyle==='inline'){const inline=main.querySelector('.mp-inline-area');if(inline)inline.innerHTML=confirmationMarkup(s,false);}
      if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}});
      return;
    }
    root.querySelectorAll('[data-page]').forEach(b=>{if(b.dataset.page===(s.page==='custom'?'providers':s.page))b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
    main.innerHTML=s.page==='custom'?customMarkup(s):s.page==='providers'?providersMarkup(s):otherMarkup(s);
    const modal=s.page==='custom'&&s.confirmation&&design.promptStyle==='modal';
    overlay.hidden=!modal;overlay.innerHTML=modal?confirmationMarkup(s,true):'';
    if(modal){main.inert=true;root.querySelector('.mp-sidebar').inert=true;if(!previousConfirmation){returnFocus=document.activeElement;queueMicrotask(()=>overlay.querySelector('[data-action="add"]')?.focus({preventScroll:true}));}}
    else {main.inert=false;root.querySelector('.mp-sidebar').inert=false;if(previousConfirmation&&returnFocus?.isConnected)returnFocus.focus({preventScroll:true});}
    previousConfirmation=modal;
    if(scenarios[s.scenario])scenarioSelect.value=s.scenario;
    if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}});
  }
  function populateSource(){
    const s=engine.state,shot=root.querySelector('#mp-source-shot'),isImage=s.clipboard.kind==='image';
    root.querySelector('#mp-source-caption').textContent=scenarios[s.scenario]?.label||'自定义示例文本；仅做模拟验证，不会发出请求';
    sourceText.value=s.clipboard.text;sourceText.hidden=isImage;root.querySelector('#mp-text-label').hidden=isImage;root.querySelector('#mp-apply-text').hidden=isImage;shot.hidden=!isImage;
    if(isImage)shot.innerHTML='<p>baseurl: https://relay.example/v1</p>'+s.clipboard.text.split('\n').slice(1).map((line,i)=>i%2===0?`<p style="margin-top:13px;margin-bottom:3px">${escape(line)}</p>`:`<code>${escape(line)}</code>`).join('');
  }
  function formFields(){return {name:main.querySelector('#mp-name')?.value||'',base:main.querySelector('#mp-base')?.value||'',key:main.querySelector('#mp-key')?.value||'',model:main.querySelector('#mp-model')?.value||'demo-chat'};}
  root.addEventListener('click',event=>{
    const nav=event.target.closest('[data-page]');if(nav){engine.setPage(nav.dataset.page);remember();return;}
    const choice=event.target.closest('[data-candidate]');if(choice){engine.selectCandidate(Number(choice.dataset.candidate));remember();return;}
    const action=event.target.closest('[data-action]')?.dataset.action;
    if(!action)return;
    if(action==='custom'||action==='providers')engine.setPage(action);
    else if(action==='reread')engine.detect(true);
    else if(action==='retry'&&engine.state.selected)engine.validate(engine.state.selected,true);
    else if(action==='validate'){const f=formFields();engine.edit(f);engine.validate(engine.state.selected,true);}
    else if(action==='dismiss')engine.dismiss();
    else if(action==='add')engine.add();
    else if(action==='reveal'){reveal=!reveal;const key=main.querySelector('#mp-key');if(key)key.type=reveal?'text':'password';const b=event.target.closest('button');b.setAttribute('aria-label',reveal?'隐藏密钥':'显示密钥');b.innerHTML=icon(reveal?'eye-off':'eye');if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}});}
    remember();
  });
  root.addEventListener('change',event=>{
    if(['mp-auto','mp-settings-auto'].includes(event.target.id)){engine.setAuto(event.target.checked);remember();}
  });
  root.addEventListener('input',event=>{
    if(['mp-name','mp-base','mp-key','mp-model'].includes(event.target.id)){fieldChange=true;engine.edit(formFields());fieldChange=false;remember();}
  });
  root.addEventListener('keydown',event=>{
    if(!engine.state.confirmation||design.promptStyle!=='modal')return;
    if(event.key==='Escape'){event.preventDefault();engine.dismiss();remember();}
    if(event.key==='Tab'){const buttons=[...overlay.querySelectorAll('button')];const first=buttons[0],last=buttons[buttons.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}
  });
  scenarioSelect.addEventListener('change',()=>{engine.setScenario(scenarioSelect.value);populateSource();remember();});
  root.querySelector('#mp-view-source').addEventListener('click',event=>{sourcePanel.hidden=!sourcePanel.hidden;event.currentTarget.setAttribute('aria-expanded',String(!sourcePanel.hidden));event.currentTarget.textContent=sourcePanel.hidden?'查看内容':'收起内容';populateSource();});
  root.querySelector('#mp-apply-text').addEventListener('click',()=>{engine.setClipboard({kind:'text',text:sourceText.value});remember();});
  globalThis.addEventListener('openai:set_globals',event=>{
    const saved=event.detail?.globals?.widgetState;if(!saved||saved.privateContent?.writer===writer)return;
    const m=saved.modelContent||{},p=saved.privateContent||{},s=engine.state;
    if((!m.page||m.page===s.page)&&(!scenarios[m.scenario]||m.scenario===s.scenario)&&(typeof p.auto!=='boolean'||p.auto===s.auto)&&(!p.promptStyle||p.promptStyle===design.promptStyle))return;
    engine.cancelPending();readHostState(saved);render();populateSource();if(engine.state.page==='custom'&&engine.state.auto)engine.detect();
  });
  render();populateSource();
  if(engine.state.page==='custom'&&engine.state.auto)engine.detect();
  if(globalThis.Tweak){const tweak=new Tweak({container:root.querySelector('#mp-window'),onChange:()=>{render();remember();}});tweak.addSelect(design,'promptStyle',{label:'添加确认方式',options:[{label:'居中弹窗',value:'modal'},{label:'页内确认',value:'inline'}]});}
})();
</script>
